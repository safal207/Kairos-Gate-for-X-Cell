[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-gate"
version = "0.1.0"
description = "Research-only protocol for phase-conditioned cellular transition assessment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "safal207"}]
dependencies = ["jsonschema[format]>=4.22,<5"]

[tool.setuptools.packages.find]
include = ["kairos_gate*"]
