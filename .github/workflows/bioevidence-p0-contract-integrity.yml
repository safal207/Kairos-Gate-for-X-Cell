name: BioEvidence P0 Contract Integrity

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tests/fixtures/**"
      - "scripts/validate_*.py"
      - "scripts/check_schema_gateway_subprocess_boundary.py"
      - ".github/workflows/bioevidence-p0-contract-integrity.yml"
  push:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tests/fixtures/**"
      - "scripts/validate_*.py"
      - "scripts/check_schema_gateway_subprocess_boundary.py"
      - ".github/workflows/bioevidence-p0-contract-integrity.yml"

permissions:
  contents: read

env:
  BIOEVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  accepted-record:
    name: accepted — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: experimental-unit
            contract: experimental-unit
            record: examples/gse141064.experimental-unit-audit.json
          - name: provenance-confounder
            contract: provenance-confounder
            record: examples/gse141064.provenance-confounder-graph.json
          - name: independent-replication
            contract: independent-replication
            record: examples/gse141064.independent-replication-search.json
          - name: valid-independent-candidate
            contract: independent-replication
            record: tests/fixtures/valid_independent_replication_candidate.json
          - name: causal-hypothesis
            contract: causal-hypothesis
            record: examples/gse141064.nfkbia-causal-hypotheses.json
          - name: temporal-replication
            contract: temporal-replication
            record: examples/gse141064.temporal-replication-gate.json
          - name: partner-handoff
            contract: partner-handoff
            record: examples/gse141064.nfkbia-partner-lab-handoff.json
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"
          echo "exact_head=$BIOEVIDENCE_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned schema runtime
        run: |
          python -m pip install --disable-pip-version-check \
            jsonschema==4.23.0 \
            referencing==0.35.1 \
            rpds-py==0.20.0 \
            attrs==24.2.0 \
            jsonschema-specifications==2024.10.1 \
            rfc3339-validator==0.1.4

      - name: Validate ${{ matrix.record }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_bioevidence_contract.py \
            "${{ matrix.contract }}" "${{ matrix.record }}"

  misuse-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"
          echo "exact_head=$BIOEVIDENCE_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned schema runtime
        run: |
          python -m pip install --disable-pip-version-check \
            jsonschema==4.23.0 \
            referencing==0.35.1 \
            rpds-py==0.20.0 \
            attrs==24.2.0 \
            jsonschema-specifications==2024.10.1 \
            rfc3339-validator==0.1.4

      - name: Compile validation entrypoints
        run: |
          python -m compileall -q \
            scripts/validate_bioevidence_contract.py \
            scripts/check_schema_gateway_subprocess_boundary.py \
            scripts/validate_experimental_unit_audit.py \
            scripts/validate_provenance_confounder_graph.py \
            scripts/validate_independent_replication_search.py \
            scripts/validate_causal_hypothesis_ranking.py \
            scripts/validate_temporal_replication_gate.py \
            scripts/validate_partner_lab_evidence_handoff.py

      - name: Prove semantic exit code cannot unlock acceptance
        working-directory: scripts
        shell: bash
        run: |
          set -euo pipefail
          python check_schema_gateway_subprocess_boundary.py \
            | tee ../schema-gateway-subprocess-boundary.txt

      - name: Prove schema invalidity overrides semantic acceptance
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/invalid_experimental_unit_extra_property.json

          python scripts/validate_experimental_unit_audit.py "$fixture" \
            > semantic-only-control.txt 2>&1
          grep -q '^ACCEPT ' semantic-only-control.txt || {
            echo "negative fixture no longer demonstrates the former authority gap"
            cat semantic-only-control.txt
            exit 1
          }

          set +e
          python scripts/validate_bioevidence_contract.py experimental-unit "$fixture" \
            > schema-first-negative.txt 2>&1
          code=$?
          set -e
          cat schema-first-negative.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' schema-first-negative.txt
          grep -q 'unexpected_authority' schema-first-negative.txt
          ! grep -q 'Traceback' schema-first-negative.txt

      - name: Confirm all misuse fixtures remain blocked without traceback
        shell: bash
        run: |
          set -euo pipefail
          check_block() {
            local contract="$1"
            local record="$2"
            local output
            output="$(mktemp)"
            set +e
            python scripts/validate_bioevidence_contract.py "$contract" "$record" \
              > "$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            test "$code" -ne 0
            grep -q '^BLOCK ' "$output"
            ! grep -q 'Traceback' "$output"
          }

          check_block experimental-unit \
            tests/fixtures/invalid_plate_as_biological_replicate.json
          check_block provenance-confounder \
            tests/fixtures/invalid_hidden_batch_path.json
          check_block independent-replication \
            tests/fixtures/invalid_same_study_as_replication.json
          check_block causal-hypothesis \
            tests/fixtures/invalid_causal_winner_without_discriminator.json
          check_block temporal-replication \
            tests/fixtures/invalid_poststim_as_direct_replication.json
          check_block partner-handoff \
            tests/fixtures/invalid_partner_handoff_authorizes_execution.json

      - name: Write exact-head contract receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head_sha=${BIOEVIDENCE_HEAD_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "github_event_sha=${GITHUB_SHA}"
            echo "gateway=scripts/validate_bioevidence_contract.py"
            echo "jsonschema=4.23.0"
            echo "authority=schema_then_semantics_exact_verdict"
            sha256sum \
              scripts/validate_bioevidence_contract.py \
              scripts/check_schema_gateway_subprocess_boundary.py \
              schemas/experimental-unit-audit.schema.json \
              schemas/bio-provenance-confounder-graph.schema.json \
              schemas/independent-replication-search.schema.json \
              schemas/causal-hypothesis-ranking.schema.json \
              schemas/temporal-replication-gate.schema.json \
              schemas/partner-lab-evidence-handoff.schema.json
          } > p0-contract-integrity-receipt.txt
          cat p0-contract-integrity-receipt.txt

      - name: Upload contract-integrity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bioevidence-p0-contract-integrity-${{ env.BIOEVIDENCE_HEAD_SHA }}
          path: |
            p0-contract-integrity-receipt.txt
            schema-gateway-subprocess-boundary.txt
            semantic-only-control.txt
            schema-first-negative.txt
          if-no-files-found: error
          retention-days: 30
