name: Biological Evidence Contracts

on:
  pull_request:
    paths:
      - ".agents/skills/bio-*/**"
      - "schemas/**"
      - "examples/**"
      - "reports/**"
      - "tests/fixtures/**"
      - "scripts/validate_*.py"
      - "scripts/audit_bioevidence_release.py"
      - "scripts/check_gse94383_*.py"
      - "scripts/probe_gse94383_tables.py"
      - "scripts/analyze_gse94383_conceptual_replication.py"
      - "scripts/probe_live_seq_supplementary_table4.py"
      - "requirements/**"
      - "README.md"
      - "MASTER_ROADMAP.md"
      - "BACKLOG.md"
      - "RELEASE_NOTES_v0.1.md"
      - "docs/**"
      - "reviews/**"
      - ".github/workflows/**"
  push:
    paths:
      - ".agents/skills/bio-*/**"
      - "schemas/**"
      - "examples/**"
      - "reports/**"
      - "tests/fixtures/**"
      - "scripts/validate_*.py"
      - "scripts/audit_bioevidence_release.py"
      - "scripts/check_gse94383_*.py"
      - "scripts/probe_gse94383_tables.py"
      - "scripts/analyze_gse94383_conceptual_replication.py"
      - "scripts/probe_live_seq_supplementary_table4.py"
      - "requirements/**"
      - "README.md"
      - "MASTER_ROADMAP.md"
      - "BACKLOG.md"
      - "RELEASE_NOTES_v0.1.md"
      - "docs/**"
      - "reviews/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  BIOEVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        run: test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"

      - name: Run v0.1 release consistency and safety audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_bioevidence_release.py | tee release-audit.txt

      - name: Upload release-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bioevidence-release-audit-${{ env.BIOEVIDENCE_HEAD_SHA }}
          path: release-audit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release-audit verdict
        if: steps.audit.outcome == 'failure'
        run: exit 1

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        run: test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned schema runtime
        run: python -m pip install --disable-pip-version-check -r requirements/schema-runtime.txt

      - name: Compile semantic implementations
        run: |
          python -m compileall -q \
            scripts/validate_bioevidence_contract.py \
            scripts/validate_experimental_unit_audit.py \
            scripts/validate_provenance_confounder_graph.py \
            scripts/validate_independent_replication_search.py \
            scripts/validate_causal_hypothesis_ranking.py \
            scripts/validate_temporal_replication_gate.py \
            scripts/validate_partner_lab_evidence_handoff.py

      - name: Validate all accepted records through canonical schema-first authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_bioevidence_contract.py experimental-unit \
            examples/gse141064.experimental-unit-audit.json
          python scripts/validate_bioevidence_contract.py provenance-confounder \
            examples/gse141064.provenance-confounder-graph.json
          python scripts/validate_bioevidence_contract.py independent-replication \
            examples/gse141064.independent-replication-search.json \
            tests/fixtures/valid_independent_replication_candidate.json
          python scripts/validate_bioevidence_contract.py causal-hypothesis \
            examples/gse141064.nfkbia-causal-hypotheses.json
          python scripts/validate_bioevidence_contract.py temporal-replication \
            examples/gse141064.temporal-replication-gate.json
          python scripts/validate_bioevidence_contract.py partner-handoff \
            examples/gse141064.nfkbia-partner-lab-handoff.json

      - name: Confirm all misuse fixtures fail closed through canonical authority
        shell: bash
        run: |
          set -euo pipefail
          check_block() {
            local contract="$1"
            local record="$2"
            local output
            output="$(mktemp)"
            set +e
            python scripts/validate_bioevidence_contract.py "$contract" "$record" > "$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            test "$code" -ne 0
            grep -q '^BLOCK ' "$output"
            ! grep -q 'Traceback' "$output"
          }
          check_block experimental-unit tests/fixtures/invalid_plate_as_biological_replicate.json
          check_block experimental-unit tests/fixtures/invalid_experimental_unit_extra_property.json
          check_block provenance-confounder tests/fixtures/invalid_hidden_batch_path.json
          check_block independent-replication tests/fixtures/invalid_same_study_as_replication.json
          check_block causal-hypothesis tests/fixtures/invalid_causal_winner_without_discriminator.json
          check_block temporal-replication tests/fixtures/invalid_poststim_as_direct_replication.json
          check_block partner-handoff tests/fixtures/invalid_partner_handoff_authorizes_execution.json

      - name: Preserve direct semantic malformed-score regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/validate_causal_hypothesis_ranking.py \
            tests/fixtures/invalid_causal_winner_without_discriminator.json \
            > causal-semantic-negative.txt 2>&1
          code=$?
          set -e
          cat causal-semantic-negative.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' causal-semantic-negative.txt
          grep -q 'score components must be integers from 0 to 4' causal-semantic-negative.txt
          ! grep -q 'Traceback' causal-semantic-negative.txt

      - name: Enforce GSE94383 cross-artifact claim boundary
        run: python scripts/check_gse94383_claim_drift.py

  live-replication-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        run: test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned analysis dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/analysis-runtime.txt

      - name: Download public GSE94383 supplementary tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-data/gse94383 live-results/gse94383
          curl --fail --location --retry 3 --retry-all-errors \
            "https://authors.library.caltech.edu/records/fyh1y-6zs57/files/1-s2.0-S2405471217301321-mmc2.csv?download=1" \
            --output live-data/gse94383/mmc2-single-cell-dynamics.csv
          curl --fail --location --retry 3 --retry-all-errors \
            "https://authors.library.caltech.edu/records/fyh1y-6zs57/files/1-s2.0-S2405471217301321-mmc3.csv?download=1" \
            --output live-data/gse94383/mmc3-single-cell-transcriptomes.csv

      - name: Verify publisher-compatible and normative checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > live-data/gse94383/MD5SUMS <<'EOF'
          8be1e148d47762fd148584469a6179a6  live-data/gse94383/mmc2-single-cell-dynamics.csv
          60a8bc62e5c49692fce8c79fdf0bf530  live-data/gse94383/mmc3-single-cell-transcriptomes.csv
          EOF
          cat > live-data/gse94383/SHA256SUMS <<'EOF'
          c43d0b54ed4b245b1690e9675630682c0843cda63f14a3e51dbf13b8f87c070e  live-data/gse94383/mmc2-single-cell-dynamics.csv
          e264565c72f06ed98ee10914c0350486dd2daa2460cd19ec8071d756bf982200  live-data/gse94383/mmc3-single-cell-transcriptomes.csv
          EOF
          md5sum --check live-data/gse94383/MD5SUMS
          sha256sum --check live-data/gse94383/SHA256SUMS

      - name: Probe table structure before analysis
        shell: bash
        run: |
          set -o pipefail
          python scripts/probe_gse94383_tables.py \
            live-data/gse94383/mmc2-single-cell-dynamics.csv \
            live-data/gse94383/mmc3-single-cell-transcriptomes.csv \
            | tee live-results/gse94383/table-probe.txt

      - name: Run exact-head descriptive pathway-context analysis
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$BIOEVIDENCE_HEAD_SHA" \
            python scripts/analyze_gse94383_conceptual_replication.py \
              --dynamics live-data/gse94383/mmc2-single-cell-dynamics.csv \
              --expression live-data/gse94383/mmc3-single-cell-transcriptomes.csv \
              --json-output live-results/gse94383/descriptive-pathway-context.json \
              --markdown-output live-results/gse94383/descriptive-pathway-context.md \
              | tee live-results/gse94383/descriptive-pathway-context.log
          grep -q 'DESCRIPTIVE_WITHIN_DATASET_SIGNAL_OBSERVED' \
            live-results/gse94383/descriptive-pathway-context.json
          ! grep -q 'CONCEPTUAL_SIGNAL_SUPPORTED' \
            live-results/gse94383/descriptive-pathway-context.json

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gse94383-live-analysis-${{ env.BIOEVIDENCE_HEAD_SHA }}
          path: |
            requirements/analysis-runtime.txt
            live-data/gse94383/MD5SUMS
            live-data/gse94383/SHA256SUMS
            live-results/gse94383/table-probe.txt
            live-results/gse94383/descriptive-pathway-context.json
            live-results/gse94383/descriptive-pathway-context.md
            live-results/gse94383/descriptive-pathway-context.log
          if-no-files-found: warn
          retention-days: 30

  target-study-supplement-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        run: test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download and verify Live-seq Supplementary Table 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-data/gse141064 live-results/gse141064
          curl --fail --location --retry 3 --retry-all-errors \
            "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-022-05046-9/MediaObjects/41586_2022_5046_MOESM7_ESM.xlsx" \
            --output live-data/gse141064/supplementary-table-4.xlsx
          echo "ffb1f233d7cd0c40d79086d92f3cf335fc6cbf0de14f64538bf063974784e925  live-data/gse141064/supplementary-table-4.xlsx" \
            > live-data/gse141064/SHA256SUMS
          sha256sum --check live-data/gse141064/SHA256SUMS

      - name: Probe original model-ranking workbook
        shell: bash
        run: |
          set -o pipefail
          python scripts/probe_live_seq_supplementary_table4.py \
            live-data/gse141064/supplementary-table-4.xlsx \
            live-results/gse141064/supplementary-table-4-probe.json \
            | tee live-results/gse141064/supplementary-table-4-probe.log

      - name: Upload target-study diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gse141064-supplementary-table4-probe-${{ env.BIOEVIDENCE_HEAD_SHA }}
          path: |
            live-data/gse141064/SHA256SUMS
            live-results/gse141064/supplementary-table-4-probe.json
            live-results/gse141064/supplementary-table-4-probe.log
          if-no-files-found: warn
          retention-days: 30
