name: GSE184241 Cell Identity Diagnostic

on:
  pull_request:
    paths:
      - "scripts/diagnose_gse184241_identity.py"
      - "scripts/run_gse184241_donor_baselines_v2.py"
      - ".github/workflows/gse184241-identity-diagnostic.yml"
  push:
    paths:
      - "scripts/diagnose_gse184241_identity.py"
      - "scripts/run_gse184241_donor_baselines_v2.py"
      - ".github/workflows/gse184241-identity-diagnostic.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COUNTS_URL: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE184nnn/GSE184241/suppl/GSE184241_combined_raw_counts.txt.gz
  BARCODES_URL: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE184nnn/GSE184241/suppl/GSE184241_barcode_sequences.xlsx

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact parser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.1 \
            pandas==2.3.1 \
            openpyxl==3.1.5 \
            scikit-learn==1.7.1

      - name: Download exact official inputs
        run: |
          mkdir -p identity-inputs identity-results
          curl --fail --location --retry 4 --retry-all-errors \
            --output identity-inputs/GSE184241_combined_raw_counts.txt.gz \
            "$COUNTS_URL"
          curl --fail --location --retry 4 --retry-all-errors \
            --output identity-inputs/GSE184241_barcode_sequences.xlsx \
            "$BARCODES_URL"

      - name: Produce exact identity diagnostic
        run: |
          set -o pipefail
          python scripts/diagnose_gse184241_identity.py \
            --counts identity-inputs/GSE184241_combined_raw_counts.txt.gz \
            --barcodes identity-inputs/GSE184241_barcode_sequences.xlsx \
            --output identity-results/gse184241-cell-identity.json \
            2>&1 | tee identity-results/diagnostic.log

      - name: Upload exact-head identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gse184241-cell-identity-${{ env.SOURCE_SHA }}
          path: identity-results
          if-no-files-found: error
          retention-days: 30
