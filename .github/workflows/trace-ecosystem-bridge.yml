name: TRACE Ecosystem Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - agent/trace-transition-ecosystem-bridge-v0.1
    paths:
      - .github/workflows/trace-ecosystem-bridge.yml
      - kairos_gate/trace_evidence_bridge.py
      - kairos_gate/__init__.py
      - kairos_gate/schemas/kairos-trace-ecosystem-receipt.schema.json
      - schemas/kairos-trace-ecosystem-receipt.schema.json
      - manifests/trace-evidence-package-pr55.v0.1.json
      - scripts/derive_trace_ecosystem_receipt.py
      - tests/test_trace_evidence_bridge.py
      - docs/TRACE_ECOSYSTEM_BRIDGE.md
  pull_request:
    paths:
      - .github/workflows/trace-ecosystem-bridge.yml
      - kairos_gate/trace_evidence_bridge.py
      - kairos_gate/__init__.py
      - kairos_gate/schemas/kairos-trace-ecosystem-receipt.schema.json
      - schemas/kairos-trace-ecosystem-receipt.schema.json
      - manifests/trace-evidence-package-pr55.v0.1.json
      - scripts/derive_trace_ecosystem_receipt.py
      - tests/test_trace_evidence_bridge.py
      - docs/TRACE_ECOSYSTEM_BRIDGE.md

permissions:
  contents: read

concurrency:
  group: trace-ecosystem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TRACE_PACKAGE_COMMIT: 31959a573724d0fd7ef1ac620a47d46355797b2f
      TRACE_BASE_URL: https://raw.githubusercontent.com/safal207/Kairos-Gate-for-X-Cell/31959a573724d0fd7ef1ac620a47d46355797b2f/evidence/trace-archaic-introgression-2026
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.EXACT_HEAD }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run bridge regressions
        run: python -m unittest discover -s tests -p 'test_trace_evidence_bridge.py' -v

      - name: Verify schema mirror
        run: |
          cmp \
            schemas/kairos-trace-ecosystem-receipt.schema.json \
            kairos_gate/schemas/kairos-trace-ecosystem-receipt.schema.json

      - name: Download exact PR 55 package
        run: |
          set -euo pipefail
          mkdir -p .artifacts/trace-source
          for name in \
            claim-map.v0.1.json \
            causal-transition-map.v0.1.json \
            disposition.v0.1.json \
            source-manifest.v0.1.json \
            reproducibility-contract.v0.1.json \
            phase-compatibility.v0.1.json
          do
            curl --location --fail --silent --show-error --retry 4 \
              --output ".artifacts/trace-source/$name" \
              "$TRACE_BASE_URL/$name"
          done

      - name: Derive portable ecosystem receipt
        run: |
          python scripts/derive_trace_ecosystem_receipt.py \
            --manifest manifests/trace-evidence-package-pr55.v0.1.json \
            --source-dir .artifacts/trace-source \
            --output .artifacts/trace-ecosystem-receipt.json \
            --enforce
          cat .artifacts/trace-ecosystem-receipt.json

      - name: Validate public receipt schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(
              Path('schemas/kairos-trace-ecosystem-receipt.schema.json').read_text(
                  encoding='utf-8'
              )
          )
          receipt = json.loads(
              Path('.artifacts/trace-ecosystem-receipt.json').read_text(
                  encoding='utf-8'
              )
          )
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(
                  schema, format_checker=FormatChecker()
              ).iter_errors(receipt),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              raise SystemExit(errors[0].message)
          print('TRACE_ECOSYSTEM_SCHEMA_PASS')
          PY

      - name: Prove byte tampering blocks without traceback
        run: |
          set -euo pipefail
          cp -R .artifacts/trace-source .artifacts/trace-source-tampered
          printf '\n' >> .artifacts/trace-source-tampered/claim-map.v0.1.json
          set +e
          python scripts/derive_trace_ecosystem_receipt.py \
            --manifest manifests/trace-evidence-package-pr55.v0.1.json \
            --source-dir .artifacts/trace-source-tampered \
            --enforce \
            > .artifacts/tamper-result.txt 2>&1
          code=$?
          set -e
          cat .artifacts/tamper-result.txt
          test "$code" -eq 2
          grep -q '^BLOCK Git blob mismatch for claim_map' .artifacts/tamper-result.txt
          if grep -q 'Traceback' .artifacts/tamper-result.txt; then
            echo 'tamper path emitted traceback'
            exit 1
          fi

      - name: Enforce ecosystem boundaries and exact head
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          receipt = json.loads(
              Path('.artifacts/trace-ecosystem-receipt.json').read_text(
                  encoding='utf-8'
              )
          )
          if receipt['source_package']['commit'] != os.environ['TRACE_PACKAGE_COMMIT']:
              raise SystemExit('source package commit mismatch')
          if len(receipt['source_package']['files']) != 6:
              raise SystemExit('expected six pinned source files')
          analysis = receipt['kairos_analysis']
          if analysis['verdict'] != 'ACCEPT_WITH_LIMITS':
              raise SystemExit('unexpected Kairos verdict')
          if analysis['temporal_conflicts'] or analysis['claim_firewall']:
              raise SystemExit('bounded graph has temporal or claim violations')
          gap_ids = {item['transition_id'] for item in analysis['causal_gaps']}
          if 'modern_to_functional_signal' not in gap_ids:
              raise SystemExit('adaptive causal gap disappeared')
          proof = receipt['proofpath_projection']
          if proof['decision'] != 'HOLD' or proof['execution_allowed'] is not False:
              raise SystemExit('ProofPath action boundary changed')
          liminal = receipt['liminaldb_projection']
          if liminal['conformance'] != 'DOCUMENTARY_PROJECTION_NOT_RUST_REPLAY':
              raise SystemExit('LiminalDB conformance was overstated')
          if liminal['projection']['adds_scientific_verdict'] is not False:
              raise SystemExit('LiminalDB added scientific authority')
          if liminal['projection']['side_effect_committed'] is not False:
              raise SystemExit('report-only continuity boundary changed')
          authority = receipt['authority']
          if authority['classification'] != 'RESEARCH_ONLY':
              raise SystemExit('receipt is not research-only')
          if any(value is not False for key, value in authority.items() if key != 'classification'):
              raise SystemExit('receipt authority escalation detected')
          checked_out = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          if checked_out != os.environ['EXACT_HEAD']:
              raise SystemExit('workflow did not validate exact requested head')
          print('TRACE_PACKAGE_IDENTITY_PASS')
          print('KAIROS_DERIVATION_PASS')
          print('CML_PROJECTION_PASS')
          print('PROOFPATH_HOLD_PASS')
          print('LIMINALDB_NO_NEW_VERDICT_PASS')
          print('EXACT_HEAD_PASS')
          PY

      - name: Upload exact-head ecosystem evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-ecosystem-${{ env.EXACT_HEAD }}
          path: |
            .artifacts/trace-ecosystem-receipt.json
            .artifacts/tamper-result.txt
            manifests/trace-evidence-package-pr55.v0.1.json
          if-no-files-found: error
          retention-days: 30
