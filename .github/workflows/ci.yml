name: Kairos Gate validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kairos-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Exact-head research validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAIROS_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KAIROS_EXACT_HEAD }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Build compact validation evidence
        run: python scripts/run_ci_evidence.py

      - name: Upload exact-head evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kairos-evidence-${{ env.KAIROS_EXACT_HEAD }}
          path: .artifacts/kairos-validation.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce fail-closed verdict
        if: ${{ always() }}
        run: python scripts/run_ci_evidence.py --enforce
