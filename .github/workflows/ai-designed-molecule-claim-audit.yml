name: AI-Designed Molecule Claim Audit

on:
  pull_request:
    paths:
      - "schemas/ai-designed-molecule-claim-audit.schema.json"
      - "examples/*.ai-designed-molecule-claim-audit.json"
      - "tests/fixtures/invalid_ai_designed_molecule_*.json"
      - "scripts/validate_ai_designed_molecule_claim_audit.py"
      - "scripts/validate_bioevidence_contract.py"
      - "reports/syntnpb-2026-ai-designed-nuclease-claim-audit.md"
      - "requirements/schema-runtime.txt"
      - ".github/workflows/ai-designed-molecule-claim-audit.yml"
  push:
    paths:
      - "schemas/ai-designed-molecule-claim-audit.schema.json"
      - "examples/*.ai-designed-molecule-claim-audit.json"
      - "tests/fixtures/invalid_ai_designed_molecule_*.json"
      - "scripts/validate_ai_designed_molecule_claim_audit.py"
      - "scripts/validate_bioevidence_contract.py"
      - "reports/syntnpb-2026-ai-designed-nuclease-claim-audit.md"
      - "requirements/schema-runtime.txt"
      - ".github/workflows/ai-designed-molecule-claim-audit.yml"

permissions:
  contents: read

env:
  BIOEVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  syntnpb-claim-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BIOEVIDENCE_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"
          echo "exact_head=$BIOEVIDENCE_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned schema runtime
        run: python -m pip install --disable-pip-version-check -r requirements/schema-runtime.txt

      - name: Compile claim-audit entrypoints
        run: |
          python -m compileall -q \
            scripts/validate_bioevidence_contract.py \
            scripts/validate_ai_designed_molecule_claim_audit.py

      - name: Validate every AI-designed molecule audit through canonical authority
        id: positive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t audits < <(
            find examples -maxdepth 1 -type f \
              -name '*.ai-designed-molecule-claim-audit.json' -print | sort
          )
          test "${#audits[@]}" -gt 0
          : > audits-accepted.txt
          for audit in "${audits[@]}"; do
            output="$(mktemp)"
            python scripts/validate_bioevidence_contract.py \
              ai-designed-molecule "$audit" | tee "$output"
            grep -q "^ACCEPT ${audit}$" "$output"
            grep -q 'contract=ai-designed-molecule' "$output"
            ! grep -q 'Traceback' "$output"
            cat "$output" >> audits-accepted.txt
          done
          test "$(grep -c '^ACCEPT ' audits-accepted.txt)" -eq "${#audits[@]}"

      - name: Prove universal, clinical, autonomous-AI, and execution claims fail closed
        id: protected_claims
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/invalid_ai_designed_molecule_claims_universal_and_clinical.json
          set +e
          python scripts/validate_bioevidence_contract.py \
            ai-designed-molecule "$fixture" \
            > syntnpb-overclaim-block.txt 2>&1
          code=$?
          set -e
          cat syntnpb-overclaim-block.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' syntnpb-overclaim-block.txt
          grep -q 'universal_superiority' syntnpb-overclaim-block.txt
          grep -q 'clinical_safety' syntnpb-overclaim-block.txt
          grep -q 'ai_autonomy must be blocked' syntnpb-overclaim-block.txt
          grep -q 'physical_authorization must be blocked' syntnpb-overclaim-block.txt
          grep -q 'claim firewall missing required claim types' syntnpb-overclaim-block.txt
          ! grep -q 'Traceback' syntnpb-overclaim-block.txt

      - name: Prove superiority evidence is claim-referenced and comparator-bound
        id: comparator_binding
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/invalid_ai_designed_molecule_unreferenced_comparator_evidence.json
          set +e
          python scripts/validate_bioevidence_contract.py \
            ai-designed-molecule "$fixture" \
            > syntnpb-comparator-binding-block.txt 2>&1
          code=$?
          set -e
          cat syntnpb-comparator-binding-block.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' syntnpb-comparator-binding-block.txt
          grep -q 'every referenced assay must use the named comparator' syntnpb-comparator-binding-block.txt
          ! grep -q 'Traceback' syntnpb-comparator-binding-block.txt

      - name: Prove structured predicates cannot be relabeled
        id: structured_predicate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("examples/syntnpb-2026.ai-designed-molecule-claim-audit.json")
          target = Path("syntnpb-mislabeled-structured-claim.json")
          record = json.loads(source.read_text(encoding="utf-8"))
          record["claim_audit"][0]["claim_predicate"] = "is_clinically_safe"
          record["claim_audit"][0]["statement"] = (
              "The molecule is clinically safe and universally superior to Cas9."
          )
          target.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

          set +e
          python scripts/validate_bioevidence_contract.py \
            ai-designed-molecule syntnpb-mislabeled-structured-claim.json \
            > syntnpb-mislabeled-claim-block.txt 2>&1
          code=$?
          set -e
          cat syntnpb-mislabeled-claim-block.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' syntnpb-mislabeled-claim-block.txt
          grep -q 'claim_predicate' syntnpb-mislabeled-claim-block.txt
          ! grep -q 'Traceback' syntnpb-mislabeled-claim-block.txt

      - name: Prove platform generalization cites structured replication evidence
        id: replication_binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("examples/syntnpb-2026.ai-designed-molecule-claim-audit.json")
          target = Path("syntnpb-platform-with-uncited-replication.json")
          record = json.loads(source.read_text(encoding="utf-8"))
          record["replication_status"] = {
              "same_collaboration_only": False,
              "independent_replication": "established",
              "replication_evidence": {
                  "unrelated_laboratory_identity": "external-lab-test-fixture",
                  "independent_materials": True,
                  "replication_unit": "independent biological preparation",
                  "evidence_refs": ["replication:external-test-fixture"],
                  "evidence_level": "F3"
              }
          }
          for claim in record["claim_audit"]:
              if claim["claim_type"] == "platform_generalization":
                  claim["status"] = "supported_with_limits"
                  claim["evidence_refs"] = ["publication"]
              if claim["claim_type"] == "independent_replication":
                  claim["status"] = "supported_with_limits"
                  claim["evidence_refs"] = [
                      "publication",
                      "replication:external-test-fixture"
                  ]
          target.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

          set +e
          python scripts/validate_bioevidence_contract.py \
            ai-designed-molecule syntnpb-platform-with-uncited-replication.json \
            > syntnpb-replication-binding-block.txt 2>&1
          code=$?
          set -e
          cat syntnpb-replication-binding-block.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' syntnpb-replication-binding-block.txt
          grep -q 'platform_generalization must reference the replication evidence' \
            syntnpb-replication-binding-block.txt
          ! grep -q 'Traceback' syntnpb-replication-binding-block.txt

      - name: Prove supported selected-candidate claims require positive selection
        id: selected_candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("examples/syntnpb-2026.ai-designed-molecule-claim-audit.json")
          target = Path("syntnpb-zero-selected-candidates.json")
          record = json.loads(source.read_text(encoding="utf-8"))
          record["screening_context"]["selected_count"] = 0
          record["screening_context"]["selected_count_status"] = "zero_exact"
          target.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

          set +e
          python scripts/validate_bioevidence_contract.py \
            ai-designed-molecule syntnpb-zero-selected-candidates.json \
            > syntnpb-zero-selected-block.txt 2>&1
          code=$?
          set -e
          cat syntnpb-zero-selected-block.txt
          test "$code" -ne 0
          grep -q '^BLOCK ' syntnpb-zero-selected-block.txt
          grep -q 'require positive selected candidates' syntnpb-zero-selected-block.txt
          ! grep -q 'Traceback' syntnpb-zero-selected-block.txt

      - name: Build exact-head acceptance receipt
        id: receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.positive.outcome }}' = success
          test '${{ steps.protected_claims.outcome }}' = success
          test '${{ steps.comparator_binding.outcome }}' = success
          test '${{ steps.structured_predicate.outcome }}' = success
          test '${{ steps.replication_binding.outcome }}' = success
          test '${{ steps.selected_candidates.outcome }}' = success
          {
            echo "contract=ai-designed-molecule"
            echo "schema_version=0.2.0-preview.2"
            echo "head_sha=$BIOEVIDENCE_HEAD_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "positive=${{ steps.positive.outcome }}"
            echo "protected_claims=${{ steps.protected_claims.outcome }}"
            echo "comparator_binding=${{ steps.comparator_binding.outcome }}"
            echo "structured_predicate=${{ steps.structured_predicate.outcome }}"
            echo "replication_binding=${{ steps.replication_binding.outcome }}"
            echo "selected_candidates=${{ steps.selected_candidates.outcome }}"
            echo "acceptance_receipt=true"
            echo "physical_biology_authorized=false"
            echo "clinical_or_field_use_authorized=false"
            sha256sum \
              schemas/ai-designed-molecule-claim-audit.schema.json \
              scripts/validate_ai_designed_molecule_claim_audit.py \
              scripts/validate_bioevidence_contract.py \
              examples/syntnpb-2026.ai-designed-molecule-claim-audit.json \
              tests/fixtures/invalid_ai_designed_molecule_claims_universal_and_clinical.json \
              tests/fixtures/invalid_ai_designed_molecule_unreferenced_comparator_evidence.json \
              reports/syntnpb-2026-ai-designed-nuclease-claim-audit.md
          } > syntnpb-claim-audit-acceptance-receipt.txt
          cat syntnpb-claim-audit-acceptance-receipt.txt
          test "$(git rev-parse HEAD)" = "$BIOEVIDENCE_HEAD_SHA"

      - name: Write workflow diagnostic state
        if: always()
        shell: bash
        run: |
          {
            echo "head_sha=$BIOEVIDENCE_HEAD_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "job_status=${{ job.status }}"
            echo "positive=${{ steps.positive.outcome }}"
            echo "protected_claims=${{ steps.protected_claims.outcome }}"
            echo "comparator_binding=${{ steps.comparator_binding.outcome }}"
            echo "structured_predicate=${{ steps.structured_predicate.outcome }}"
            echo "replication_binding=${{ steps.replication_binding.outcome }}"
            echo "selected_candidates=${{ steps.selected_candidates.outcome }}"
            echo "receipt=${{ steps.receipt.outcome }}"
            echo "acceptance_receipt_requires_all_success=true"
          } > syntnpb-workflow-state.txt
          cat syntnpb-workflow-state.txt

      - name: Upload claim-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syntnpb-ai-designed-molecule-audit-${{ env.BIOEVIDENCE_HEAD_SHA }}
          path: |
            audits-accepted.txt
            syntnpb-overclaim-block.txt
            syntnpb-comparator-binding-block.txt
            syntnpb-mislabeled-structured-claim.json
            syntnpb-mislabeled-claim-block.txt
            syntnpb-platform-with-uncited-replication.json
            syntnpb-replication-binding-block.txt
            syntnpb-zero-selected-candidates.json
            syntnpb-zero-selected-block.txt
            syntnpb-claim-audit-acceptance-receipt.txt
            syntnpb-workflow-state.txt
          if-no-files-found: error
          retention-days: 30
