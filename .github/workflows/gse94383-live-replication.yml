name: GSE94383 Live Replication Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_gse94383_tables.py"
      - "scripts/analyze_gse94383_conceptual_replication.py"
      - "examples/gse141064.independent-replication-search.json"
      - ".github/workflows/gse94383-live-replication.yml"
  push:
    paths:
      - "scripts/probe_gse94383_tables.py"
      - "scripts/analyze_gse94383_conceptual_replication.py"
      - "examples/gse141064.independent-replication-search.json"
      - ".github/workflows/gse94383-live-replication.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas

      - name: Download public GSE94383 supplementary tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-data/gse94383 live-results/gse94383

          curl --fail --location --retry 3 --retry-all-errors \
            "https://authors.library.caltech.edu/records/fyh1y-6zs57/files/1-s2.0-S2405471217301321-mmc2.csv?download=1" \
            --output live-data/gse94383/mmc2-single-cell-dynamics.csv

          curl --fail --location --retry 3 --retry-all-errors \
            "https://authors.library.caltech.edu/records/fyh1y-6zs57/files/1-s2.0-S2405471217301321-mmc3.csv?download=1" \
            --output live-data/gse94383/mmc3-single-cell-transcriptomes.csv

      - name: Verify publisher checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > live-data/gse94383/MD5SUMS <<'EOF'
          8be1e148d47762fd148584469a6179a6  live-data/gse94383/mmc2-single-cell-dynamics.csv
          60a8bc62e5c49692fce8c79fdf0bf530  live-data/gse94383/mmc3-single-cell-transcriptomes.csv
          EOF
          md5sum --check live-data/gse94383/MD5SUMS

      - name: Probe table structure before analysis
        shell: bash
        run: |
          set -o pipefail
          python scripts/probe_gse94383_tables.py \
            live-data/gse94383/mmc2-single-cell-dynamics.csv \
            live-data/gse94383/mmc3-single-cell-transcriptomes.csv \
            | tee live-results/gse94383/table-probe.txt

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: gse94383-live-probe-${{ github.sha }}
          path: |
            live-data/gse94383/MD5SUMS
            live-results/gse94383/table-probe.txt
          if-no-files-found: error
          retention-days: 30
