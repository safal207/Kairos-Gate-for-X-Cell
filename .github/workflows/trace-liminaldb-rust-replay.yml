name: TRACE LiminalDB Rust Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/trace-liminaldb-rust-replay-v0.1
    paths:
      - .github/workflows/trace-liminaldb-rust-replay.yml
      - tools/liminaldb_bridge/trace_ecosystem_replay.rs
      - tests/test_trace_liminaldb_rust_replay_contract.py
      - docs/TRACE_LIMINALDB_RUST_REPLAY.md
      - kairos_gate/trace_evidence_bridge.py
      - scripts/derive_trace_ecosystem_receipt.py
      - manifests/trace-evidence-package-pr55.v0.1.json
  pull_request:
    paths:
      - .github/workflows/trace-liminaldb-rust-replay.yml
      - tools/liminaldb_bridge/trace_ecosystem_replay.rs
      - tests/test_trace_liminaldb_rust_replay_contract.py
      - docs/TRACE_LIMINALDB_RUST_REPLAY.md
      - kairos_gate/trace_evidence_bridge.py
      - scripts/derive_trace_ecosystem_receipt.py
      - manifests/trace-evidence-package-pr55.v0.1.json

permissions:
  contents: read

concurrency:
  group: trace-liminaldb-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TRACE_PACKAGE_COMMIT: 31959a573724d0fd7ef1ac620a47d46355797b2f
      TRACE_BASE_URL: https://raw.githubusercontent.com/safal207/Kairos-Gate-for-X-Cell/31959a573724d0fd7ef1ac620a47d46355797b2f/evidence/trace-archaic-introgression-2026
      LIMINALDB_COMMIT: b8cf0528187c6d3fac3b28dbb9e90f1a2fb740e7
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.EXACT_HEAD }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Kairos package
        run: python -m pip install -e .

      - name: Run replay contract regressions
        run: python -m unittest discover -s tests -p 'test_trace_liminaldb_rust_replay_contract.py' -v

      - name: Download exact TRACE evidence package
        run: |
          set -euo pipefail
          mkdir -p .artifacts/trace-source
          for name in \
            claim-map.v0.1.json \
            causal-transition-map.v0.1.json \
            disposition.v0.1.json \
            source-manifest.v0.1.json \
            reproducibility-contract.v0.1.json \
            phase-compatibility.v0.1.json
          do
            curl --location --fail --silent --show-error --retry 4 \
              --output ".artifacts/trace-source/$name" \
              "$TRACE_BASE_URL/$name"
          done

      - name: Derive exact TRACE ecosystem receipt
        run: |
          python scripts/derive_trace_ecosystem_receipt.py \
            --manifest manifests/trace-evidence-package-pr55.v0.1.json \
            --source-dir .artifacts/trace-source \
            --output .artifacts/trace-ecosystem-receipt.json \
            --enforce

      - name: Checkout pinned LiminalDB
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: safal207/LiminalDB
          ref: ${{ env.LIMINALDB_COMMIT }}
          path: .artifacts/LiminalDB
          persist-credentials: false

      - name: Verify LiminalDB pin and install replay example
        run: |
          set -euo pipefail
          test "$(git -C .artifacts/LiminalDB rev-parse HEAD)" = "$LIMINALDB_COMMIT"
          cp tools/liminaldb_bridge/trace_ecosystem_replay.rs \
            .artifacts/LiminalDB/liminal-db/crates/liminal-store/examples/trace_ecosystem_replay.rs

      - name: Execute real WAL snapshot reopen replay
        working-directory: .artifacts/LiminalDB
        run: |
          cargo run --locked -p liminal-store --example trace_ecosystem_replay -- \
            "$GITHUB_WORKSPACE/.artifacts/trace-ecosystem-receipt.json" \
            "$GITHUB_WORKSPACE/.artifacts/trace-ledger" \
            "$GITHUB_WORKSPACE/.artifacts/trace-liminaldb-rust-replay-receipt.json"

      - name: Enforce recovered report-only projection
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          source_path = Path('.artifacts/trace-ecosystem-receipt.json')
          replay_path = Path('.artifacts/trace-liminaldb-rust-replay-receipt.json')
          replay = json.loads(replay_path.read_text(encoding='utf-8'))
          expected_source_digest = 'sha256:' + hashlib.sha256(source_path.read_bytes()).hexdigest()
          required = {
              'schema_version': '0.1.0',
              'artifact_type': 'trace_liminaldb_rust_replay_receipt',
              'liminaldb_commit': os.environ['LIMINALDB_COMMIT'],
              'source_receipt_sha256': expected_source_digest,
              'transition_id': 'trace-pr55-kairos-analysis-v0-1',
              'event_count_before_reopen': 5,
              'event_count_after_reopen': 5,
              'snapshot_event_count': 5,
              'projection_count': 1,
              'projection_equal_after_reopen': True,
              'final_side_effect_committed': False,
              'final_event_count': 5,
              'source_verdict': 'ACCEPT_WITH_LIMITS',
              'adds_scientific_verdict': False,
              'verdict': 'RUST_REPLAY_RECOVERED_REPORT_ONLY',
          }
          for key, expected in required.items():
              if replay.get(key) != expected:
                  raise SystemExit(f'{key} mismatch: {replay.get(key)!r} != {expected!r}')
          dimensions = replay.get('final_dimensions')
          if dimensions != {
              'authority': 'VALID',
              'execution': 'OBSERVED_EXECUTED',
              'response_integrity': 'VERIFIED',
              'causal_validity': 'NOT_EVALUATED',
              'continuity_posture': 'REPORT_ONLY',
          }:
              raise SystemExit(f'final dimensions mismatch: {dimensions!r}')
          refs = [
              replay.get('final_authorization_ref'),
              *(replay.get('final_observation_refs') or []),
              replay.get('final_response_integrity_ref'),
              replay.get('final_causal_audit_ref'),
              replay.get('final_continuity_snapshot_ref'),
          ]
          if len(refs) != 5 or any(
              not isinstance(ref, str)
              or not ref.startswith('sha256:')
              or len(ref) != 71
              for ref in refs
          ):
              raise SystemExit('replayed semantic references are not SHA-256 bound')
          for key in ('snapshot_digest', 'final_event_hash'):
              value = replay.get(key)
              if (
                  not isinstance(value, str)
                  or not value.startswith('sha256:')
                  or len(value) != 71
              ):
                  raise SystemExit(f'invalid {key}')
          checked_out = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          if checked_out != os.environ['EXACT_HEAD']:
              raise SystemExit('Kairos workflow did not validate the exact PR head')
          print('TRACE_LIMINALDB_RUST_REPLAY_PASS')
          print('SNAPSHOT_FULL_REPLAY_EQUAL_PASS')
          print('REPORT_ONLY_BOUNDARY_PASS')
          print('EXACT_HEAD_PASS')
          PY

      - name: Prove authority tampering blocks
        working-directory: .artifacts/LiminalDB
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('../trace-ecosystem-receipt.json')
          target = Path('../trace-ecosystem-receipt-tampered.json')
          value = json.loads(source.read_text(encoding='utf-8'))
          value['liminaldb_projection']['projection']['side_effect_committed'] = True
          target.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          set +e
          cargo run --locked -p liminal-store --example trace_ecosystem_replay -- \
            "$GITHUB_WORKSPACE/.artifacts/trace-ecosystem-receipt-tampered.json" \
            "$GITHUB_WORKSPACE/.artifacts/tampered-ledger" \
            "$GITHUB_WORKSPACE/.artifacts/tampered-replay.json" \
            > "$GITHUB_WORKSPACE/.artifacts/tampered-rust-result.txt" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/.artifacts/tampered-rust-result.txt"
          test "$code" -ne 0
          grep -q 'final projection exceeded the source boundary' \
            "$GITHUB_WORKSPACE/.artifacts/tampered-rust-result.txt"
          if grep -Eqi 'panicked|stack backtrace' \
            "$GITHUB_WORKSPACE/.artifacts/tampered-rust-result.txt"; then
            echo 'tamper path panicked instead of failing closed'
            exit 1
          fi

      - name: Build evidence digests
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/digests
          find .artifacts/trace-ledger -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > .artifacts/digests/trace-ledger-sha256.txt
          sha256sum \
            .artifacts/trace-ecosystem-receipt.json \
            .artifacts/trace-liminaldb-rust-replay-receipt.json \
            > .artifacts/digests/receipt-sha256.txt

      - name: Upload exact-head Rust replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-liminaldb-rust-${{ env.EXACT_HEAD }}
          path: |
            .artifacts/trace-ecosystem-receipt.json
            .artifacts/trace-liminaldb-rust-replay-receipt.json
            .artifacts/trace-ledger
            .artifacts/tampered-rust-result.txt
            .artifacts/digests
          if-no-files-found: error
          retention-days: 30
