name: Dataset readiness real-input audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dataset-readiness-scanner-v0.1
    paths:
      - .github/workflows/dataset-readiness-real.yml
      - kairos_gate/dataset_adapters.py
      - kairos_gate/dataset_readiness.py
      - examples/live-seq-gse141064.dataset-manifest.v0.1.json
  pull_request:
    paths:
      - .github/workflows/dataset-readiness-real.yml
      - kairos_gate/dataset_adapters.py
      - kairos_gate/dataset_readiness.py
      - examples/live-seq-gse141064.dataset-manifest.v0.1.json

permissions:
  contents: read

concurrency:
  group: dataset-readiness-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Pinned GSE141064 readiness audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      STACK_BASE: e84a01d6c9877d2361d33e8b91560f5355de6608
      META_URL: https://raw.githubusercontent.com/DeplanckeLab/Live-seq/6633d4d468f56031ea197474e09921088d878512/data/meta.final.csv
      COUNT_URL: https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSE141064&file=GSE141064_count.final.csv.gz&format=file
      META_SHA256: dcce9bea9444857a6a042fc64be3a5c7b31a00095a21eabc1488e516abd689c8
      COUNT_SHA256: 0e8a07d36a4b06bc8ced881bf97114adc2b55681b5ccf00d29e4f80e05107b22
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner
        run: |
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e .

      - name: Download and verify pinned public inputs
        run: |
          set -euo pipefail
          mkdir -p .artifacts/dataset-readiness-real
          curl --location --fail --silent --show-error --retry 4 \
            --output .artifacts/dataset-readiness-real/meta.final.csv \
            "$META_URL"
          curl --location --fail --silent --show-error --retry 4 \
            --output .artifacts/dataset-readiness-real/GSE141064_count.final.csv.gz \
            "$COUNT_URL"
          printf '%s  %s\n' \
            "$META_SHA256" .artifacts/dataset-readiness-real/meta.final.csv \
            "$COUNT_SHA256" .artifacts/dataset-readiness-real/GSE141064_count.final.csv.gz \
            > .artifacts/dataset-readiness-real/input-sha256.txt
          sha256sum --check .artifacts/dataset-readiness-real/input-sha256.txt

      - name: Run real-input readiness scanner
        id: audit
        run: |
          set +e
          kairos audit-dataset \
            --manifest examples/live-seq-gse141064.dataset-manifest.v0.1.json \
            --metadata .artifacts/dataset-readiness-real/meta.final.csv \
            --matrix .artifacts/dataset-readiness-real/GSE141064_count.final.csv.gz \
            > .artifacts/dataset-readiness-real/result.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat .artifacts/dataset-readiness-real/result.json

      - name: Enforce real blocked state and build attestation
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('.artifacts/dataset-readiness-real')
          result_path = root / 'result.json'
          manifest_path = Path(
              'examples/live-seq-gse141064.dataset-manifest.v0.1.json'
          )
          result = json.loads(result_path.read_text(encoding='utf-8'))

          if os.environ.get('AUDIT_EXIT_CODE') != '2':
              raise SystemExit('real blocked readiness result must return exit code 2')
          if result.get('status') != 'BLOCKED_REPLICATE_SEMANTICS_UNRESOLVED':
              raise SystemExit(
                  'Expected exact linkage with replicate semantics unresolved; '
                  f"got {result.get('status')!r}"
              )
          dataset = result.get('dataset', {})
          if dataset.get('id') != 'GSE141064':
              raise SystemExit('unexpected dataset identifier')
          inputs = result.get('inputs', {})
          if inputs.get('metadata', {}).get('identifiers') != 1012:
              raise SystemExit('unexpected metadata identifier count')
          if inputs.get('matrix', {}).get('sample_identifiers') != 1012:
              raise SystemExit('unexpected matrix sample identifier count')
          if inputs.get('metadata', {}).get('sha256') != 'sha256:' + os.environ['META_SHA256']:
              raise SystemExit('metadata digest mismatch in scanner result')
          if inputs.get('matrix', {}).get('sha256') != 'sha256:' + os.environ['COUNT_SHA256']:
              raise SystemExit('matrix digest mismatch in scanner result')

          cohort = result.get('cohort', {})
          if cohort.get('selection_uses_response_label') is not False:
              raise SystemExit('cohort selection must remain response-independent')
          if cohort.get('selected_records') != 17:
              raise SystemExit('unexpected selected Live-seq cohort size')
          if cohort.get('response_complete_records') != 17:
              raise SystemExit('unexpected response-complete cohort size')
          if cohort.get('missing_response_sample_ids') != []:
              raise SystemExit('real selected cohort has missing response labels')
          if cohort.get('missing_selected_sample_ids') != []:
              raise SystemExit('real selected cohort is missing from the matrix')

          replicates = result.get('replicates', {})
          if replicates.get('semantics') != 'unresolved':
              raise SystemExit('real replicate semantics changed without review')
          if replicates.get('independent_units') != []:
              raise SystemExit('candidate independent units unexpectedly appeared')
          if replicates.get('cross_group_repeated_identity_ids') != []:
              raise SystemExit('repeated identities cross candidate groups')

          authority = result.get('authority', {})
          expected_false = (
              'preregistration_gate_passed',
              'model_fitting_authorized',
              'experiment_authorization',
              'clinical_authorization',
              'merge_authorization',
          )
          for field in expected_false:
              if authority.get(field) is not False:
                  raise SystemExit(f'{field} must remain false')

          exact_head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          git_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          stack_base = os.environ['STACK_BASE']
          subprocess.run(
              ['git', 'merge-base', '--is-ancestor', stack_base, exact_head],
              check=True,
          )
          if exact_head != os.environ['EXACT_HEAD']:
              raise SystemExit('checkout does not match requested exact head')

          def digest(path: Path) -> str:
              return 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()

          attestation = {
              'schema': 'kairos.dataset-readiness-real-attestation.v0.1',
              'dataset_id': 'GSE141064',
              'exact_head': exact_head,
              'git_tree': git_tree,
              'stack_base': stack_base,
              'manifest_path': str(manifest_path),
              'manifest_sha256': digest(manifest_path),
              'result_sha256': digest(result_path),
              'input_digest_record_sha256': digest(root / 'input-sha256.txt'),
              'status': result['status'],
              'authority': {
                  'classification': 'RESEARCH_ONLY',
                  'model_fitting_authorized': False,
                  'experiment_authorization': False,
                  'clinical_authorization': False,
                  'merge_authorization': False,
              },
          }
          output = root / 'attestation.json'
          output.write_text(
              json.dumps(attestation, indent=2, sort_keys=True, allow_nan=False)
              + '\n',
              encoding='utf-8',
          )
          print(output.read_text(encoding='utf-8'))
          print('REAL_GSE141064_READINESS_BLOCKED_AS_EXPECTED')
          PY

      - name: Upload derived exact-head evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dataset-readiness-real-${{ env.EXACT_HEAD }}
          path: |
            .artifacts/dataset-readiness-real/result.json
            .artifacts/dataset-readiness-real/input-sha256.txt
            .artifacts/dataset-readiness-real/attestation.json
            examples/live-seq-gse141064.dataset-manifest.v0.1.json
          if-no-files-found: error
          retention-days: 30
