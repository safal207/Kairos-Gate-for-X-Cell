name: GSE184241 Donor Benchmark

on:
  pull_request:
    paths:
      - "scripts/probe_gse184241_inputs.py"
      - "scripts/run_gse184241_donor_baselines.py"
      - "scripts/run_gse184241_donor_baselines_v2.py"
      - "scripts/run_gse184241_donor_baselines_entry.py"
      - "scripts/validate_gse184241_donor_benchmark.py"
      - "scripts/compare_gse184241_benchmark_evidence.py"
      - "schemas/gse184241-donor-benchmark.schema.json"
      - "examples/gse184241.donor-held-out-benchmark.json"
      - "tests/fixtures/invalid_gse184241_cell_random_split.json"
      - "reports/gse184241-donor-held-out-benchmark-2026-07-23.md"
      - ".github/workflows/gse184241-donor-benchmark.yml"
  push:
    paths:
      - "scripts/probe_gse184241_inputs.py"
      - "scripts/run_gse184241_donor_baselines.py"
      - "scripts/run_gse184241_donor_baselines_v2.py"
      - "scripts/run_gse184241_donor_baselines_entry.py"
      - "scripts/validate_gse184241_donor_benchmark.py"
      - "scripts/compare_gse184241_benchmark_evidence.py"
      - "schemas/gse184241-donor-benchmark.schema.json"
      - "examples/gse184241.donor-held-out-benchmark.json"
      - "tests/fixtures/invalid_gse184241_cell_random_split.json"
      - "reports/gse184241-donor-held-out-benchmark-2026-07-23.md"
      - ".github/workflows/gse184241-donor-benchmark.yml"

permissions:
  contents: read

jobs:
  donor-held-out-baselines:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      COUNTS_URL: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE184nnn/GSE184241/suppl/GSE184241_combined_raw_counts.txt.gz
      BARCODES_URL: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE184nnn/GSE184241/suppl/GSE184241_barcode_sequences.xlsx
    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.1 \
            pandas==2.3.1 \
            scikit-learn==1.7.1 \
            openpyxl==3.1.5

      - name: Validate static contracts
        run: |
          python -m json.tool schemas/gse184241-donor-benchmark.schema.json >/dev/null
          python -m json.tool examples/gse184241.donor-held-out-benchmark.json >/dev/null
          python -m json.tool tests/fixtures/invalid_gse184241_cell_random_split.json >/dev/null
          python scripts/validate_gse184241_donor_benchmark.py \
            examples/gse184241.donor-held-out-benchmark.json

      - name: Download official GEO processed inputs
        run: |
          mkdir -p benchmark-inputs benchmark-results
          curl --fail --location --retry 4 --retry-all-errors \
            --output benchmark-inputs/GSE184241_combined_raw_counts.txt.gz \
            "$COUNTS_URL"
          curl --fail --location --retry 4 --retry-all-errors \
            --output benchmark-inputs/GSE184241_barcode_sequences.xlsx \
            "$BARCODES_URL"
          sha256sum benchmark-inputs/* | tee benchmark-results/input-sha256.txt

      - name: Probe matrix and barcode workbook
        run: |
          python scripts/probe_gse184241_inputs.py \
            --counts benchmark-inputs/GSE184241_combined_raw_counts.txt.gz \
            --barcodes benchmark-inputs/GSE184241_barcode_sequences.xlsx \
            --output benchmark-results/input-probe.json \
            --source-revision "$SOURCE_SHA"
          python -m json.tool benchmark-results/input-probe.json >/dev/null

      - name: Run baseline and capture diagnostics
        run: |
          set +e
          python scripts/run_gse184241_donor_baselines_entry.py \
            --counts benchmark-inputs/GSE184241_combined_raw_counts.txt.gz \
            --barcodes benchmark-inputs/GSE184241_barcode_sequences.xlsx \
            --output-json benchmark-results/donor-held-out-baselines.json \
            --output-report benchmark-results/donor-held-out-baselines.md \
            --source-revision "$SOURCE_SHA" \
            > benchmark-results/baseline.log 2>&1
          status=$?
          printf '%s\n' "$status" > benchmark-results/baseline-exit-code.txt
          cat benchmark-results/baseline.log
          exit 0

      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse184241-baseline-diagnostics-${{ env.SOURCE_SHA }}
          path: |
            benchmark-results/input-sha256.txt
            benchmark-results/input-probe.json
            benchmark-results/baseline.log
            benchmark-results/baseline-exit-code.txt
            benchmark-results/donor-held-out-baselines.json
            benchmark-results/donor-held-out-baselines.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce baseline exit code
        run: |
          status="$(cat benchmark-results/baseline-exit-code.txt)"
          if [ "$status" != "0" ]; then
            echo "baseline failed with exit code $status"
            exit "$status"
          fi
          python -m json.tool benchmark-results/donor-held-out-baselines.json >/dev/null

      - name: Validate generated donor benchmark
        run: |
          python scripts/validate_gse184241_donor_benchmark.py \
            benchmark-results/donor-held-out-baselines.json | tee benchmark-results/validation.log

      - name: Confirm canonical evidence has not drifted
        run: |
          python scripts/compare_gse184241_benchmark_evidence.py \
            benchmark-results/donor-held-out-baselines.json \
            examples/gse184241.donor-held-out-benchmark.json

      - name: Confirm cell-random donor leakage fails closed
        run: |
          if python scripts/validate_gse184241_donor_benchmark.py \
            tests/fixtures/invalid_gse184241_cell_random_split.json; then
            echo "donor leakage fixture was incorrectly accepted"
            exit 1
          fi
          echo "donor leakage correctly blocked"

      - name: Verify foundation-model boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmark-results/donor-held-out-baselines.json').read_text())
          assert data['split_contract']['biological_unit'] == 'donor'
          assert data['split_contract']['strategy'] == 'leave_one_donor_out'
          assert data['split_contract']['cell_random_split_allowed'] is False
          assert data['geneformer']['status'] == 'GENEFORMER_RUNTIME_HOLD'
          assert data['geneformer']['inference_executed'] is False
          assert data['claim_boundary']['same_cell_future_response_prediction'] == 'blocked'
          PY

      - name: Upload exact-head benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: gse184241-donor-held-out-baselines-${{ env.SOURCE_SHA }}
          path: |
            benchmark-results/input-sha256.txt
            benchmark-results/input-probe.json
            benchmark-results/donor-held-out-baselines.json
            benchmark-results/donor-held-out-baselines.md
            benchmark-results/validation.log
          if-no-files-found: error
          retention-days: 30
