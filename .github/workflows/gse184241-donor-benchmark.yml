name: GSE184241 Donor Benchmark

on:
  pull_request:
    paths:
      - "scripts/probe_gse184241_inputs.py"
      - "scripts/run_gse184241_donor_baselines.py"
      - "schemas/gse184241-donor-benchmark.schema.json"
      - "examples/gse184241.donor-held-out-benchmark.json"
      - "tests/fixtures/invalid_gse184241_cell_random_split.json"
      - "reports/gse184241-donor-held-out-benchmark-2026-07-23.md"
      - ".github/workflows/gse184241-donor-benchmark.yml"
  push:
    paths:
      - "scripts/probe_gse184241_inputs.py"
      - "scripts/run_gse184241_donor_baselines.py"
      - "schemas/gse184241-donor-benchmark.schema.json"
      - "examples/gse184241.donor-held-out-benchmark.json"
      - "tests/fixtures/invalid_gse184241_cell_random_split.json"
      - "reports/gse184241-donor-held-out-benchmark-2026-07-23.md"
      - ".github/workflows/gse184241-donor-benchmark.yml"

permissions:
  contents: read

jobs:
  input-probe:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      COUNTS_URL: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE184nnn/GSE184241/suppl/GSE184241_combined_raw_counts.txt.gz
      BARCODES_URL: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE184nnn/GSE184241/suppl/GSE184241_barcode_sequences.xlsx
    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download official GEO processed inputs
        run: |
          mkdir -p benchmark-inputs benchmark-results
          curl --fail --location --retry 4 --retry-all-errors \
            --output benchmark-inputs/GSE184241_combined_raw_counts.txt.gz \
            "$COUNTS_URL"
          curl --fail --location --retry 4 --retry-all-errors \
            --output benchmark-inputs/GSE184241_barcode_sequences.xlsx \
            "$BARCODES_URL"
          sha256sum benchmark-inputs/* | tee benchmark-results/input-sha256.txt

      - name: Probe matrix and barcode workbook
        run: |
          python scripts/probe_gse184241_inputs.py \
            --counts benchmark-inputs/GSE184241_combined_raw_counts.txt.gz \
            --barcodes benchmark-inputs/GSE184241_barcode_sequences.xlsx \
            --output benchmark-results/input-probe.json \
            --source-revision "$SOURCE_SHA"
          python -m json.tool benchmark-results/input-probe.json >/dev/null

      - name: Upload exact-head input evidence
        uses: actions/upload-artifact@v4
        with:
          name: gse184241-input-probe-${{ env.SOURCE_SHA }}
          path: |
            benchmark-results/input-sha256.txt
            benchmark-results/input-probe.json
          if-no-files-found: error
          retention-days: 30
